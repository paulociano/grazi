name: Windows installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.x'
          architecture: x64
      - name: Install Python build dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt -r requirements-build.txt
      - name: Build application bundle
        run: python -m PyInstaller --noconfirm --clean grazi.spec
      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress --yes
      - name: Build installer
        shell: powershell
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss'
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Grazi-Windows-installer
          path: installer-output/Grazi-Setup-v0.9.0.exe
